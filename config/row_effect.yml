# 架台・段の候補（案 X 改。docs/LAYOUT_OVERLAY_DESIGN.md）の設定。閾値（候補・注意・重大）はルールセットの block_row にある。
# ここは、見え方の影響の関数を求める条件と、段を判断できる条件（位置の多さ）。値を変えたら version を上げる
shared:
  version: "2026-11-08-v1"
  model:
    # 見え方の影響の関数を求めるのに要る、解析済みの画像の数（飛行 008 の試しで、40 枚でも全飛行との差は 0.10℃）
    min_images: 40
    # 観測が画像の上から下まで写っていること（パネルの中心の縦位置の最小がこれ以下・最大がこれ以上）
    min_y_low: 0.2
    min_y_high: 0.8
    # 外れ値を除く: 残差の mad_used（下限 mad_floor_c）の mad_k 倍を超える観測を除いて当てはめ直す
    mad_k: 3
    mad_floor_c: 0.3
  row:
    # 段を判断できる条件: min_views 枚以上に写り、画像の上半分（縦 upper_y 未満）にも下半分（縦 lower_y 超）にも写る
    min_views: 3
    upper_y: 0.45
    lower_y: 0.55
    # 画像ごとに、その段のパネルが何枚以上写っていれば観測に数えるか（端で切れたパネルは除く）
    min_panels_per_view: 3
