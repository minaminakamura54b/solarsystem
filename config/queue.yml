default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

# 実案件用。解析エンジンを同時に動かす数 = threads（既定 4。Mac の 8 コアで Docker のエミュレーションと取り合わない数）
work:
  <<: *default
  workers:
    - queues: "*"
      threads: <%= ENV.fetch("SOLARSIGHT_ANALYZE_THREADS", 4) %>
      processes: 1
      polling_interval: 0.1
