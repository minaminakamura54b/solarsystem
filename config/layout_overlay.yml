# 配置図と位置情報によるパネルの自動特定（位置合わせ）の設定（docs/LAYOUT_OVERLAY_DESIGN.md の B）。
# 判定（異常か正常か・重大度）の閾値ではなく、「画像の画素とパネルの対応を自動で信用してよいか」を決める値。
# 値を変えたら version を上げる（画像ごとの記録に、使った版を残す）
shared:
  version: "2026-11-09-v1"

  # 位置合わせ後に残ったずれ（残差）が、パネル幅に対してこの割合以内なら自動でパネル領域を作る。
  # 超えた画像は要確認（needs_review。理由: 位置合わせ不可）にし、正常にはしない。
  # 初期値 0.25（2026-11-06 ユーザー指示）。検証の結果を見て調整する
  max_residual_panel_width_ratio: 0.25

  # 画像の位置（georef）を自動の位置合わせに使える条件（B-1）。満たさない画像は位置合わせ不可（要確認）
  georef:
    # 真下向き（ジンバルの角度 -90°）からのずれの上限（度）。傾けた画像はまだ扱わない
    max_off_nadir_deg: 5.0
    # RTK が固定解（RtkFlag = 50）であること
    require_rtk_fixed: true
    # RTK の標準偏差（RtkStdLon / RtkStdLat / RtkStdHgt）の上限（m）
    max_rtk_std_m: 0.10

  # カメラごとの画素の角度（mrad/画素）の初期値。キーは inspection_images.camera_model。
  # 架台の地図を作るときに画像から推定し直す（設計案 手順 4）。ここに無いカメラは位置合わせ不可
  cameras:
    "DJI M4T":
      # 2026-11 の検証（飛行 008）で、パネル面までの距離を使って推定した値（センサーの公称値 12 µm / 12 mm = 1.0）
      ifov_mrad: 0.975
      # 同時撮影の RGB（広角）の画素の角度（mrad/画素）と、その値の基準の横の画素数。RGB の切り出しの中心を、
      # サーモとの画角の比で求めるのに使う（Phase 7 の決定事項 2026-11-09）。35mm 換算 24 mm・横 4032 画素の公称値から
      # （半画角の正接 18/24 を 2016 画素で割った値）。位置合わせを調整した値ではないので、切り出しは「おおよその位置」のまま
      rgb_ifov_mrad: 0.372
      rgb_reference_width: 4032
